<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://kit.fontawesome.com/acf1f97d6a.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="/css/style.css">
  <title>Slider</title>
</head>
<body>
  <div class="slider">
    <div class="slide current">
      <div class="content">
        <h1>Slider One</h1>
        <h3>This is slider one...</h3>
      </div>
    </div>
    <div class="slide">
      <div class="content">
        <h1>Slider Two</h1>
        <h3>This is slider two...</h3>
      </div>
    </div>
    <div class="slide">
      <div class="content">
        <h1>Slider Three</h1>
        <h3>This is slider three...</h3>
      </div>
    </div>
    <div class="slide">
      <div class="content">
        <h1>Slider Four</h1>
        <h3>This is slider four...</h3>
      </div>
    </div>
    <div class="slide">
      <div class="content">
        <h1>Slider Five</h1>
        <h3>This is slider five...</h3>
      </div>
    </div>
    <div class="slide">
      <div class="content">
        <h1>Slider Six</h1>
        <h3>This is slider six...</h3>
      </div>
    </div>
  </div>

  <div class="buttons">
    <button class="prev">
      <i fill="black" class="fa-solid fa-caret-left"></i>
    </button>
    <button class="next">
      <i fill="black" class="fa-solid fa-caret-right"></i>
    </button>
  </div>


  <script src="/js/main.js"></script>
  
</body>
</html>
